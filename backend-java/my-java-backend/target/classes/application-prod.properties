# Server Configuration for Production Environment

# Server port configuration
server.port=8080

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/myapp_db
spring.datasource.username=myapp_user
spring.datasource.password=myapp_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect

# Logging configuration
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

# Security configuration
spring.security.user.name=admin
spring.security.user.password=admin_password

# Other application-specific properties
app.featureX.enabled=true
app.featureY.timeout=30