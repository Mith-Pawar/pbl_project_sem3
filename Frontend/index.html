<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
      <div class="nav-left">
        <a href="#">HOME</a>
        <a href="#">PROFILE</a>
      </div>
      <div class="nav-right">
        <a href="#" id="nav-login">LOGIN</a>
  <a href="footer.html">CONTACT</a>
        <!-- nav-welcome is shown when a user is logged in -->
        <a href="#" id="nav-welcome" style="display:none;"></a>
      </div>
    </nav>
    
    <!-- Overlay HTML -->
    <div class="overlay">
        <h1>FOCUS FIT</h1>
        <h2>Boost Your Focus </h2>
        <p>Train your brain to stay Sharp, Motivated, and Distraction-free with fun Exercises</p>
        <p>Sharp, Motivated, and Distraction-free with fun Exercises</p>
  <button class="start-button" id="goto-login"><span>Login</span></button>
        
    </div>
<!-- Counter directly below the button -->
        <div class="user-counter">
            <span id="counter">0</span> users joined
        </div>
    <div id="three-container" style="width:100vw; height:805px;"></div>
    <hr>
   
     <!-- Importmap must be inside a script tag -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.179.1/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.179.1/examples/jsm/loaders/GLTFLoader.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.179.1/examples/jsm/controls/OrbitControls.js"
      }
    }
    </script>
    
    <script type="module" src="script.js"></script>

    <div id="login-modal" class="login-modal">
  <div class="login-box">
  <h2>Login</h2>
  <div class="error-message" id="login-error" style="display:none;margin-top:6px;text-align:center;">something went wrong, try again</div>
    <form id="login-form">
      <label for="username">Email</label>
      <input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="login-btn" >Login</button>

      <div class="signup-row">
        <p>Don't have account?</p>
        <button type="button" id="open-register" class="login-btn">Sign Up</button>
      </div>
    </form>
    <button id="close-login" class="close-btn">&times;</button>
  </div>
</div>
</body>
</html>
